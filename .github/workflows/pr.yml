name: PR

on:
  pull_request:
    branches: [main]
    # `edited` is load-bearing: without it a description that passed on open can
    # be edited to add a credential afterwards and never be scanned again.
    types: [opened, edited, reopened, synchronize]

# A force-push should not leave the previous run burning minutes.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-lint:
    name: Conventional commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # The PR TITLE is linted rather than individual commits because merges are
      # squashes: the title becomes the commit that lands on main and the input
      # release-please reads to compute the next version.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            perf
            build
            ci
          requireScope: false

  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Bot branches are exempt because neither release-please nor Dependabot
      # lets you name its branches — without the exemption every bot PR fails
      # permanently.
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            release-please--*|dependabot/*)
              echo "bot branch '$BRANCH' — exempt"; exit 0 ;;
          esac
          if printf '%s' "$BRANCH" | grep -qE '^(feat|fix|docs|refactor|test|chore|perf|build|ci)/[a-z0-9._-]+$'; then
            echo "ok: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' does not match ^(feat|fix|docs|refactor|test|chore|perf|build|ci)/[a-z0-9._-]+$"
            echo "Examples: feat/oauth-redirect-pinning, fix/slack-socket-reconnect, docs/install-notes"
            exit 1
          fi

  pr-description:
    name: PR description scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # The same patterns-block.txt/patterns-warn.txt the local commit-msg hook
      # uses, so the two cannot drift. GitHub's push protection scans file
      # content only and never reads a PR description. See .githooks/README.md
      # for why the two files carry different severities.
      - name: Scan the PR description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > /tmp/pr-body.txt

          if grep -nEf .githooks/patterns-block.txt /tmp/pr-body.txt; then
            echo "::error::The PR description contains what looks like a credential."
            echo "Edit the description. Note that GitHub retains and displays edit history, so a real credential must be ROTATED, not merely removed."
            exit 1
          fi

          warn_hits=$(grep -nEf .githooks/patterns-warn.txt /tmp/pr-body.txt || true)
          if [ -n "$warn_hits" ]; then
            echo "::warning::The PR description contains what looks like a local-environment path or internal address (advisory only, not blocking):"
            printf '%s\n' "$warn_hits"
          fi

          echo "ok"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build

  preview:
    name: Preview deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # CLOUDFLARE_API_TOKEN is not configured yet — the owner has to mint a
      # narrowly-scoped one, and this job runs on every PR in the meantime.
      # GitHub Actions does not expose the `secrets` context in a job-level
      # `if:`, so the guard has to live inside the job instead: assign the
      # secret to an env var on its own step and test THAT (never echo the
      # value itself), then gate the upload/comment steps on the result. This
      # keeps the job green until the secret exists, rather than putting a red
      # check on every PR that trains people to ignore CI.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured — preview deploys are disabled until it is set. This is expected, not a failure."
          fi

      # `versions upload` publishes a preview WITHOUT promoting it to the
      # hostname, so rookery.cloud keeps serving the released version.
      - name: Upload a preview version
        id: preview
        if: steps.creds.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload 2>&1 | tee out.txt
          url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' out.txt | head -1)
          echo "url=${url:-unavailable}" >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@v2
        if: steps.creds.outputs.has_token == 'true'
        with:
          header: preview
          message: |
            **Preview:** ${{ steps.preview.outputs.url }}

            Built from this branch. `rookery.cloud` still serves the released version.
